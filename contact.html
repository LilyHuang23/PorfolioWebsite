<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我 - Lily Huang</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
<body data-i18n-title="title.contact">
    <header class="header">
        <a href="index.html" class="logo">Portfolio</a>
        <i class='bx bx-menu' id="menu-icon"></i>
        <nav class="navbar">
            <a href="index.html" style="--i:10;" data-i18n="nav.home">首頁</a>
            <a href="project.html" style="--i:11;" data-i18n="nav.projects">作品集</a>
            <a href="resume.html" style="--i:12;" data-i18n="nav.resume">履歷</a>
            <a href="contact.html" style="--i:13;" class="active" data-i18n="nav.contact">聯絡方式</a>
        </nav>
        <div class="header-actions">
            <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language">EN</button>
            <div class="toggle">
                <i class="bx bx-moon toggle-icon"></i>
            </div>
        </div>
    </header>
    <div class="container">
        <div class="form">
        <div class="contact-info">
            <h3 class="title" data-i18n="contact.title">讓我們保持聯繫</h3>
            <p class="text" data-i18n="contact.text">感謝你瀏覽我的作品集！希望你會喜歡。以下是我的聯絡資訊，歡迎隨時與我聯繫！</p>
            <div class="info">
                
                <div class="information">
                    <i class='icon bx bx-envelope' ></i>
                    <p>huanglily5023@gmail.com</p>
                </div>
            </div>
            <div class="social-media-contact">
                <p data-i18n="contact.socialText">與我聯繫</p>
                <div class="social-icons">
                    <a href="https://www.linkedin.com/in/lily-huang-yl" target="_blank" rel="noopener"><i class='bx bxl-linkedin' ></i></a>
                    <a href="https://github.com/LilyHuang23" target="_blank" rel="noopener"><i class='bx bxl-github' ></i></a>
                    <a href="https://www.instagram.com/iamlilyhuang/" target="_blank" rel="noopener"><i class='bx bxl-instagram-alt' ></i></a>                </div>
            </div>
        </div>
        <div class="contact-form">
            <form action="contact.html" autocomplete="off">
                <h3 class="title" data-i18n="contact.title">讓我們保持聯繫</h3>
                <div class="input-container focus">
                    <input type="text" name="name" class="input" />
                    <label for="" data-i18n="label.fullName">姓名</label>
                    <span data-i18n="label.fullName">姓名</span>
                </div>
                <div class="input-container focus">
                    <input type="email" name="email" class="input" />
                    <label for="" data-i18n="label.email">電子郵件</label>
                    <span data-i18n="label.email">電子郵件</span>
                </div>
                <div class="input-container focus">
                    <input type="tel" name="phone" class="input" />
                    <label for="" data-i18n="label.phone">電話</label>
                    <span data-i18n="label.phone">電話</span>
                </div>
                <div class="input-container textarea focus">
                    <textarea name="message" class="input"></textarea>
                    <label for="" data-i18n="label.message">訊息</label>
                    <span data-i18n="label.message">訊息</span>
                </div>
                <input type="submit" value="送出" class="submit-btn" data-i18n-value="submit.btn" />
            </form>
        </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
